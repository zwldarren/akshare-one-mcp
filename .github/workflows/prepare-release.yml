name: Prepare release

# Cut a release without touching pyproject.toml by hand: pick "Run workflow" in
# the Actions tab, type the version, and this bumps the version, commits it,
# pushes the vX.Y.Z tag, then dispatches release.yml and publish-registry.yml at
# that tag (a GITHUB_TOKEN tag push does not trigger the push event itself).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without the leading v)"
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      # The input reaches the shell through the environment rather than being
      # interpolated into the script text, so a crafted value cannot run commands.
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z, got '$VERSION'"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi

      - name: Commit and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uv version "$VERSION"
          git add pyproject.toml uv.lock
          git commit -m "chore(release): bump version to $VERSION"
          git tag "v$VERSION"
          git push origin HEAD:"${GITHUB_REF_NAME}" "v$VERSION"

      - name: Trigger the release workflows
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run release.yml --ref "v$VERSION"
          gh workflow run publish-registry.yml --ref "v$VERSION"
          sleep 5
          gh run list --limit 2
