[project]
name = "akshare-one-mcp"
version = "0.5.2"
description = "MCP server that provides access to Chinese stock market data using akshare-one"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zwldarren", email = "zwldarren@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    # get_time_info and get_valuation call akshare directly, below the akshare-one
    # layer, so the floor is ours to declare rather than one we inherit. Take the
    # same range akshare-one supports: get_time_info resolves the trading-calendar
    # function by name at runtime, so it works on both sides of the 1.20.45 rename.
    # Declaring it here also puts it in front of dependabot instead of leaving the
    # transitive floor to drift out from under us. 1.18.1 rather than 1.18.0: the
    # 1.18 line starts at 1.18.1 on PyPI, so 1.18.0 is a floor no install can
    # satisfy — and akshare-one's floor was moved to match.
    "akshare>=1.18.1",
    # 0.6.1 was the first akshare-one that survives akshare 1.20.46+, which is
    # what `pip install akshare` puts on a machine today (0.6.0 still called
    # stock_zh_a_hist and stock_zh_a_daily, both removed upstream, so every
    # historical fallback below eastmoney_direct's first try was dead). 0.7.0
    # carries the same interface and drops the Python 3.10 leg whose lock could
    # only resolve a soupsieve with an open advisory.
    "akshare-one>=0.7.0",
    "fastmcp>=2.11.3",
    "uvicorn>=0.35.0",
    # Imported directly by providers.py to type the fallback helper (akshare-one
    # pulls pandas in too, but we depend on it explicitly so this package keeps
    # working if akshare-one changes its dependency set).
    "pandas>=2.0",
    # Every upstream is reached through requests, and requests only understands a
    # SOCKS proxy when PySocks is importable. Without this, a user behind one —
    # `ALL_PROXY=socks5://...` in China is the common case (issue #23) — gets
    # "Missing dependencies for SOCKS support" from every data tool with no hint
    # that the fix is a package install.
    "pysocks>=1.7.1",
]
keywords = ["akshare", "stock", "mcp", "mcp-server"]
classifiers = [
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pandas-stubs>=2.3.0.250703",
    "ruff>=0.14.3",
]

[project.urls]
Homepage = "https://github.com/zwldarren/akshare-one-mcp"
Repository = "https://github.com/zwldarren/akshare-one-mcp.git"

[project.scripts]
akshare-one-mcp = "akshare_one_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "standard"

[tool.mypy]
[[tool.mypy.overrides]]
# akshare ships neither a py.typed marker nor a stub package.
module = ["akshare", "akshare.*"]
ignore_missing_imports = true
